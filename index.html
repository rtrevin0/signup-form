<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign Up</title>
</head>
<body>
    <div class="container">
        <img src="kevin-mueller-PvpeQjWk33Y-unsplash.jpg" 
             alt="Snow-capped mountain peak at sunrise with rocky foreground" 
             class="image"
        >
        <div class="content">
            <div class="signup-text">
                <p class="signup-description">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
                <p class="signup-description">You <i>know</i> you want to.</p>
            </div>
            <div class="signup-form-container">
                <form class="signup-form">
                <div class="signup-form-textboxes">
                     <p>Let's do this!</p>
                    <div class="signup-form-row">
                        <div class="signup-form-input-group">
                            <label for="firstName">First Name</label>
                            <input type="text" name="firstName" class="input" required>
                        </div>
                        <div class="signup-form-input-group">
                            <label for="lastName">Last Name</label>
                            <input type="text" name="lastName" class="input" required>
                        </div>
                    </div>
                    <div class="signup-form-row">
                        <div class="signup-form-input-group">
                            <label for="email">Email</label>
                            <input type="email" placeholder="Email" name="email" class="input" required>
                        </div>
                        <div class="signup-form-input-group">
                            <label for="phoneNumber">Phone Number</label>
                            <input type="text" name="phoneNumber" class="input" required>
                        </div>
                    </div>
                    <div class="signup-form-row">
                        <div class="signup-form-input-group">
                            <label for="password">Password</label>
                            <input type="password" placeholder="Password" name="password" class="input" required>
                        </div>
                        <div class="signup-form-input-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" placeholder="Confirm Password" name="confirmPassword" class="input" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="create-account">Create Account</button>
            </form>
            </div>
            <div class="login-link-container">
                <span class="login-link">Already have an account? <a href="#">Log in</a></span>
            </div>
        </div>
    </div>
</body>
</html>
